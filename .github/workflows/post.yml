name: ATB post

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05; posts anything due in the last 6 h
  workflow_dispatch: {}

concurrency:
  group: atb-state
  cancel-in-progress: false

permissions:
  contents: write         # save content/posted.json back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Post due Reels
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -u -m atb.run
      - name: Save state
        if: always()
        run: |
          git config user.name "atb-bot"
          git config user.email "atb-bot@users.noreply.github.com"
          git add content/posted.json
          git diff --cached --quiet || (git commit -m "Update posted [skip ci]" && git pull --rebase && git push)
